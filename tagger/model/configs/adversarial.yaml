model: AdversarialDeepSetModel
run_config:
  verbose: 2
  debug: True

data: "training_data/all"
labels:
  H_bb: [H_bb]
  H_cc: [H_cc]
  H_qq: [H_qq]
  #W_qq: [W_qq]
  Top_bWqq: [Top_bWqq]
  Top_Wqq: [Top_Wqq]
  background: [QCD_others]

pt_regress: True
hyperparameter_opt: False

model_config:
  name: fatjet_md
  conv1d_layers: [64, 256, 256]
  classification_layers: [64, 64]
  regression_layers: [10]
  kernel_initializer: "lecun_uniform"
  aggregator: "max"
  #beta: 1.1e-5

quantization_config:
  quantizer_bits: 16
  quantizer_bits_int: 2
  quantizer_alpha_val: 1
  pt_output_quantization: [16, 6]

training_config:
  weight_method: "onlyclass"
  epochs: 600
  batch_size: 16
  learning_rate: 0.0000035322
  validation_split: 0.1

  loss_weights: [1.0, 1.0, 1.]

  initial_sparsity: 0.0
  final_sparsity: 0.0

  EarlyStopping_patience: 20

  ReduceLROnPlateau_factor: 0.5
  ReduceLROnPlateau_patience: 10
  ReduceLROnPlateau_min_lr: 0.000000001

hls4ml_config:
  input_precision: "ap_fixed<24,12,AP_RND,AP_SAT>"
  class_precision: "ap_ufixed<24,12,AP_RND,AP_SAT>"
  reg_precision: "ap_fixed<16,6,AP_RND,AP_SAT>"

  project_name: "fatjet_md"
