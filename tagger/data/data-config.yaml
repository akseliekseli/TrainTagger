jet_collection: sc8

# Training inputs ONLY: XtoHH + QCD.
input:
  - "/eos/home-a/asuutari/FastPUPPI/17_0_X/fp_jettuples_151X_SC4_SC8_v2/XtoHH_*/FP/fp_jettuples_151X_SC4_SC8_v2/*.root"
  - "/eos/home-a/asuutari/FastPUPPI/17_0_X/fp_jettuples_151X_SC4_SC8_v2/QCD_*/FP/fp_jettuples_151X_SC4_SC8_v2/*.root"

output: "/eos/home-a/asuutari/FastPUPPI/XtoHH-qcd-evaluation/training_data"

processing:
  step_size: "500MB"
  ratio: 1.0
  num_workers: 8
  n_particles: 16
  input_tag: "baseline_hardware_inputs"
  extras: "extra_fields"

classes:
  - H_bb
  - H_cc
  - H_qq
  - H_gg
  - QCD_bb
  - QCD_cc
  - QCD_b
  - QCD_c
  - QCD_others

signal_processes:
  - name: XtoHH
    input:
      - "/eos/home-a/asuutari/FastPUPPI/17_0_X/fp_jettuples_151X_SC4_SC8_v2/signal_holdout/XtoHH_MX_140To780_PU200/FP/fp_jettuples_151X_SC4_SC8_v2/*.root"
