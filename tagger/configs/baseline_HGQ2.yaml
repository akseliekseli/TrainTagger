  output: training_data_small/
  tree: outnano/Jets
  step_size: 100MB
  ratio: 1.0
  num_workers: 8
  extras: extra_fields
  signal_processes:
  - name: GluGluHHTo2B2Tau
    input:
      - /eos/cms/store/cmst3/group/l1tr/sewuchte/l1teg/fp_jettuples_191125_151X/GluGluHHTo2B2Tau_PU200/FP/fp_jettuples_v151Xv1/
    output: signal_process_data/GluGluHHTo2B2Tau

  - name: QCD_Pt300To470
    input:
      - /eos/cms/store/cmst3/group/l1tr/sewuchte/l1teg/fp_jettuples_191125_151X/QCD_Pt300To470_PU200/FP/fp_jettuples_v151Xv1/
    output: signal_process_data/QCD_Pt300To470

model: DeepSetModelHGQ2

run_config:
  verbose: 2
  debug: true
  num_threads: 24

model_config:
  name: baseline_HGQ2
  conv1d_layers: [10, 10]
  conv1d_parallelisation_factor: [16, 16]
  classification_layers: [32, 16]
  classification_parallelisation_factor: [32, 16]
  regression_layers: [10]
  regression_parallelisation_factor: [10]
  beta: 1.1e-10

quantization_config:
  pt_output_quantization: [16, 6]

training_config:
  weight_method: onlyclass
  epochs: 200
  batch_size: 1024
  learning_rate: 0.003
  validation_split: 0.1
  loss_weights: [1, 1]
  target_ebops: 300000

firmware_config:
  input_precision: ap_fixed<24,12,AP_RND,AP_SAT>
  class_precision: ap_ufixed<24,12,AP_RND,AP_SAT>
  reg_precision: ap_fixed<16,6,AP_RND,AP_SAT>
  clock_period: 2.5
  fpga_part: xcvu13p-flga2577-2-e
  project_name: L1TSC4NGJetModel

