    # Replace null with your requested jet_pt_phys limits, in GeV.
    # Lower bound inclusive; upper bound exclusive.
    pt_min: null
    pt_max: null

  - name: MinBias
    input:
      - "/eos/home-a/asuutari/FastPUPPI/17_0_X/fp_jettuples_151X_SC4_SC8_v2/MinBias_PU200/FP/fp_jettuples_151X_SC4_SC8_v2/*.root"
