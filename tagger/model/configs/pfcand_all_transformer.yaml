model: TransformerFatJet
run_config:
  verbose: 2
  debug: True

data: "training_data/pfcand_fields_all/"
labels:
  bb: [H_bb]
  cc: [H_cc]
  qq: [H_qq, W_qq, Top_bWqq, Top_Wqq]
  background: [QCD_others]
columns: [0, 4, 29, 30]
undersampling: [300000, 10000]

pt_regress: True
hyperparameter_opt: False
adversarial: False

model_config:
  name: md_transformer
  emb_layers: [64, 64, 64]
  transformer_layers: [[2, 16, 2, 64], [2, 16, 2, 64]] #num_heads, mha_hidden_dim, num_dense_layers, dim_dense_layers
  classification_layers: [64, 32]
  regression_layers: [10]
  kernel_initializer: "lecun_uniform"

quantization_config:

training_config:
  weight_method: "mass"
  reference: "background"
  epochs: 1000
  batch_size: 128
  learning_rate: 0.0001
  validation_split: 0.1

  loss_weights: [1, 1.]

  initial_sparsity: 0.0
  final_sparsity: 0.0

  EarlyStopping_patience: 20

  ReduceLROnPlateau_factor: 0.5
  ReduceLROnPlateau_patience: 10
  ReduceLROnPlateau_min_lr: 0.00000001

hls4ml_config:
